<header class="app-header">

  <div class="brand">
    QA SmartPredict AI
  </div>

  <div class="user-zone" *ngIf="connected">

    <span class="welcome">
      Welcome {{ fullName }}
    </span>

    <button class="logout-btn" (click)="logoutUser()">
      Logout
    </button>

  </div>

  <div class="user-zone" *ngIf="!connected">

    <button class="login-btn" (click)="loginUser()">
      Login
    </button>

  </div>

</header>
