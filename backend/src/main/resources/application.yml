spring:
  application:
    name: qa-smartpredict-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/qasmartpredict
    username: admin
    password: admin

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8081

ai:
  provider: openrouter
  api-key: "${OPENROUTER_API_KEY:}"
  base-url: "https://openrouter.ai/api/v1"
  model: "openrouter/free"
  
qa:
  llm:
    mode: ${QA_LLM_MODE:LOCAL}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://ollama:11434}
      model: ${OLLAMA_MODEL:llama3.2:3b}
    openrouter:
      api-key: ${OPENROUTER_API_KEY:}
      model: ${OPENROUTER_MODEL:openrouter/free}