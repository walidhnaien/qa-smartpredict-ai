spring:
  application:
    name: qa-smartpredict-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/qasmartpredict
    username: admin
    password: admin

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8081

ai:
  provider: openrouter
  api-key: "${OPENROUTER_API_KEY:}"
  base-url: "https://openrouter.ai/api/v1"
  model: "openrouter/free"